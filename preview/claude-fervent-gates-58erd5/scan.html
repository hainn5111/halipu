<!doctype html>
<!-- TRANG ẨN (công cụ test): không có link từ giao diện chính, chỉ vào được khi gõ địa chỉ /scan.html. Giữ nguyên cấu trúc bản vanilla cũ; sửa/thêm tính năng thử nghiệm tại đây. File phụ thuộc nằm ở legacy/ (config.js là bản sao riêng, KHÔNG đọc config.json của app). --><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dự án · SLCP</title><link rel="stylesheet" href="legacy/style.css">
<style>body{display:block}.wrap{max-width:900px;margin:0 auto}.card{max-width:none}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #334155;word-break:break-all}th{color:#94a3b8}a{color:#f59e0b}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row input{width:auto}.row button,td button{width:auto;margin:0;padding:6px 12px;font-size:13px}td button+button{margin-left:6px}
.ghost{background:#334155!important;color:#e2e8f0!important}</style></head><body><div class="wrap"><div class="card">
<div class="row"><h1 style="flex:1">Dự án của tài khoản</h1><a href="./">← Trang chính</a></div>
<p class="sub">Danh sách lấy từ hồ sơ (projectInfos). Không tự quét: bấm "Quét" ở từng dòng hoặc "Quét tất cả". Quét chỉ đọc (lcuActor/page + lcuLight/queryLcuLightByLcuIdAndNum, đèn số 1), không gửi lệnh điều khiển.</p>
<div class="row" style="margin-bottom:12px"><input id="nid" placeholder="Nhập projectId" size="34" autocomplete="off" spellcheck="false"><input id="nname" placeholder="Tên (tuỳ chọn)" size="16"><button id="add" type="button">Thêm &amp; quét</button></div>
<div class="row"><label>Lấy lần đo từ năm <input id="yr" type="number" value="2026" style="width:90px"></label><button id="go" type="button">Quét tất cả</button><button id="csv" type="button" class="ghost" hidden>Tải CSV</button></div>
<p class="sub" id="st" style="margin-top:10px"></p>
<div style="overflow:auto"><table><thead><tr><th>Dự án</th><th>projectId</th><th>LCU</th><th>LCU có đo ≥ năm</th><th>Lần đo gần nhất</th><th></th></tr></thead><tbody id="t"></tbody></table></div>
<details><summary>Nhật ký lỗi</summary><pre id="log"></pre></details>
</div></div>
<script src="legacy/config.js"></script><script src="legacy/api.js"></script>
<script>
if (!SLCP.token) location.replace('index.html');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const P = [], logs = [], XKEY = 'scan_extra';   // P: [{id, name, manual, scanned, lcus, recent, latest, busy, err}]
const extraLoad = () => { try { return JSON.parse(localStorage.getItem(XKEY) || '[]'); } catch { return []; } };
const extraSave = a => { try { localStorage.setItem(XKEY, JSON.stringify(a)); } catch {} };
async function pool(items, n, fn) { let i = 0; await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) await fn(items[i++]); })); }
function addProject(id, name, manual) {
  id = id.trim(); if (!id) return null;
  let p = P.find(x => x.id === id);
  if (!p) { p = { id, name: name || '', manual }; P.push(p); } else if (name && !p.name) p.name = name;
  return p;
}
function fromProfile(d) {   // dạng thật: projectInfos[{projectName, projectId, enabled}]
  if (d && Array.isArray(d.projectInfos)) return d.projectInfos.filter(x => x && x.projectId && x.enabled !== 'N').map(x => ({ id: x.projectId, name: x.projectName || '' }));
  const out = [], walk = v => { if (!v || typeof v !== 'object') return; if (Array.isArray(v)) return v.forEach(walk);
    if (typeof v.projectId === 'string') out.push({ id: v.projectId, name: v.projectName || v.name || '' }); Object.values(v).forEach(walk); };
  walk(d); return out;
}
// Cùng luồng với lcus.html khi nhập ProjectID: lcuActor/page + getLcuListByProjectId.
async function lcusOf(pid) {
  const map = new Map();
  try { for (const r of await SLCP.pageAll('lcuActor/page', pid)) { const k = r.lcuId || r.uid; if (k) map.set(k, { lcuId: r.lcuId, uid: r.uid }); } } catch (e) { logs.push(`${pid} page: ${e.message}`); }
  try { for (const r of (await SLCP.call('POST', 'lcuActor/getLcuListByProjectId', { projectId: pid, body: { projectId: pid } })) || []) { if (r.lcuId && !map.has(r.lcuId)) map.set(r.lcuId, { lcuId: r.lcuId, uid: r.luid }); } } catch (e) { logs.push(`${pid} list: ${e.message}`); }
  return [...map.values()].filter(x => x.lcuId);
}
async function scanOne(p) {
  const year = String(yr.value || '2026');
  Object.assign(p, { busy: true, scanned: false, lcus: 0, recent: 0, latest: '', err: '' }); render();
  try {
    const rows = await lcusOf(p.id); p.lcus = rows.length;
    await pool(rows, 4, async x => {
      try {
        const l = await SLCP.call('POST', 'lcuLight/queryLcuLightByLcuIdAndNum', { projectId: p.id, body: { lcuId: x.lcuId, num: 1, projectId: p.id } });
        const d = l && l.dtime ? String(l.dtime) : '';
        if (d && d.slice(0, 4) >= year) p.recent++;
        if (d > p.latest) p.latest = d;
      } catch (e) { logs.push(`${p.id}/${x.lcuId}: ${e.message}`); }
    });
  } catch (e) { p.err = e.message; logs.push(`${p.id}: ${e.message}`); }
  p.busy = false; p.scanned = true; render(); log.textContent = logs.slice(0, 200).join('\n');
}
function render() {
  t.innerHTML = P.map(p => `<tr><td>${esc(p.name)}${p.manual ? ' <small>(nhập tay)</small>' : ''}</td><td><code>${esc(p.id)}</code></td>
<td>${p.busy ? 'đang quét…' : p.scanned ? p.lcus : '–'}</td><td>${p.scanned ? p.recent : '–'}</td><td>${esc(p.latest || (p.scanned ? (p.err ? 'lỗi' : '(chưa có)') : ''))}</td>
<td><button type="button" data-scan="${esc(p.id)}"${p.busy ? ' disabled' : ''}>Quét</button><button type="button" class="ghost" data-pid="${esc(p.id)}">Chọn</button>${p.manual ? `<button type="button" class="ghost" data-del="${esc(p.id)}">Xoá</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="6">Chưa có dự án nào.</td></tr>';
  csv.hidden = !P.some(p => p.scanned);
}
t.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pid) { try { localStorage.setItem('pid_fixed', b.dataset.pid); } catch {} location.href = './#/lcus'; }
  else if (b.dataset.scan) scanOne(P.find(x => x.id === b.dataset.scan));
  else if (b.dataset.del) { P.splice(P.findIndex(x => x.id === b.dataset.del), 1); extraSave(extraLoad().filter(x => x.id !== b.dataset.del)); render(); }
};
add.onclick = () => {
  const id = nid.value.trim(); if (!id) return;
  const p = addProject(id, nname.value.trim(), true); if (!p) return;
  if (p.manual) { const a = extraLoad().filter(x => x.id !== id); a.push({ id, name: p.name }); extraSave(a); }
  nid.value = nname.value = ''; render(); scanOne(p);
};
nid.addEventListener('keydown', e => { if (e.key === 'Enter') add.click(); });
go.onclick = async () => {
  go.disabled = true; let done = 0; st.textContent = `Đang quét ${P.length} dự án…`;
  await pool(P, 2, async p => { await scanOne(p); st.textContent = `Đã quét ${++done}/${P.length} dự án…`; });
  st.textContent = `Xong ${P.length} dự án; ${P.filter(p => p.recent > 0).length} dự án có LCU đo từ ${yr.value}.`; go.disabled = false;
};
csv.onclick = () => {
  const rows = [['project', 'projectId', 'lcus', 'lcu_recent', 'latest_dtime'], ...P.filter(p => p.scanned).map(p => [p.name, p.id, p.lcus, p.recent, p.latest])];
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' }));
  a.download = 'projects-scan.csv'; a.click();
};
extraLoad().forEach(x => addProject(x.id, x.name, true)); render();
SLCP.getUser().then(d => {
  const l = fromProfile(d);
  l.forEach(x => { const p = addProject(x.id, x.name, false); if (p) p.manual = false; });   // có trong hồ sơ thì không coi là nhập tay
  st.textContent = `${l.length} dự án trong hồ sơ.`; render();
}).catch(e => { st.textContent = 'Không đọc được hồ sơ: ' + e.message; });
</script></body></html>
