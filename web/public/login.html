<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · SLCP</title><link rel="stylesheet" href="/style.css"></head><body>
<form class="card" id="f">
  <h1>Đăng nhập</h1><p class="sub">Hệ thống điều khiển chiếu sáng thông minh</p>
  <label for="u">Tài khoản</label><input id="u" autocomplete="username" required>
  <label for="p">Mật khẩu</label><input id="p" type="password" autocomplete="current-password" required>
  <button id="b">Đăng nhập</button><div class="err" id="e"></div>
</form>
<script>
fetch('/api/me').then(r => { if (r.ok) location.replace('/home'); });
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u.value.trim(), password: p.value }) });
    const d = await r.json();
    if (d.ok) location.replace('/home'); else e.textContent = d.message || 'Đăng nhập thất bại';
  } catch { e.textContent = 'Lỗi mạng'; }
  b.disabled = false;
};
</script></body></html>
