name: E2E smoke (read-only)

# Test đọc-only cho bản vanilla CŨ (site/), nay chỉ giữ để tra cứu → chỉ chạy tay. Test cho bản chính nằm ở web-ci.yml (e2e/web-smoke.js).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL bản deploy để test (vd https://<user>.github.io/<repo>); bỏ trống = build trong repo (localhost)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve site
        run: |
          python3 -m http.server 8080 --directory site >/dev/null 2>&1 &
          sleep 2
      - name: Smoke test
        env:
          FONDA_USER: ${{ secrets.FONDA_USER }}
          FONDA_PASS: ${{ secrets.FONDA_PASS }}
          BASE: ${{ inputs.base_url || 'http://localhost:8080' }}
        run: node e2e/smoke.js
        # BASE do input quyết định (để trống thì dùng localhost:8080)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: e2e-*.png, if-no-files-found: ignore }
