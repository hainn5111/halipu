name: Preview

# Link xem thử riêng cho từng nhánh: https://<owner>.github.io/<repo>/preview/<tên-nhánh>/
#  - Mở/cập nhật pull request (cùng repo): tự build + deploy preview và đăng link vào PR.
#  - Chạy tay (Actions → Preview → Run workflow, chọn nhánh): preview cho nhánh chưa có PR.
#  - Đóng PR hoặc xoá nhánh: tự dọn thư mục preview.
# Preview KHÔNG đụng tới gốc trang (chỉ main deploy ra gốc). PR từ fork bị bỏ qua (không cấp quyền ghi/secret cho mã lạ).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  delete:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tên thư mục preview từ tên nhánh
        id: slug
        env:
          RAW_REF: ${{ github.head_ref || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          slug=$(printf '%s' "$RAW_REF" | tr 'A-Z' 'a-z' | sed 's#[^a-z0-9._-]#-#g')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          owner=$(printf '%s' "$OWNER" | tr 'A-Z' 'a-z')
          echo "url=https://${owner}.github.io/${REPO}/preview/${slug}/" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Build
        working-directory: web
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          # pull_request: GITHUB_SHA là commit MERGE tạm (refs/pull/N/merge), không phải commit trên nhánh → dùng head.sha để mã hiển thị khớp commit
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm ci
          # VITE_ENABLE_PROBE=1: chỉ bản preview mới có nhóm "Công cụ dò" (pages.yml/main không đặt biến này)
          VITE_ENABLE_PROBE=1 VITE_BUILD_INFO="preview/${SLUG}@${SHA::7}" npm run build
      - name: Publish preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: web/dist
          target-folder: preview/${{ steps.slug.outputs.slug }}
          commit-message: "preview ${{ steps.slug.outputs.slug }}@${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Link trong tóm tắt run
        env:
          URL: ${{ steps.slug.outputs.url }}
        run: |
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Đăng/cập nhật link trong PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.slug.outputs.url }}
        with:
          script: |
            const marker = '<!-- preview-link -->';
            const body = `${marker}\n🔗 **Preview:** ${process.env.URL}\n\nCommit \`${context.sha.slice(0, 7)}\`. Link tự cập nhật mỗi lần push vào PR và bị xoá khi đóng PR.`;
            const { owner, repo } = context.repo, issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body && c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  cleanup:
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tên thư mục preview
        id: slug
        env:
          RAW_REF: ${{ github.event.ref || github.head_ref }}
        run: |
          slug=$(printf '%s' "$RAW_REF" | tr 'A-Z' 'a-z' | sed 's#[^a-z0-9._-]#-#g')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        id: co
        continue-on-error: true      # gh-pages chưa tồn tại thì không có gì để dọn
        with:
          ref: gh-pages
      - name: Xoá thư mục preview
        if: steps.co.outcome == 'success'
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          if [ -d "preview/$SLUG" ]; then
            git rm -rq "preview/$SLUG"
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "remove preview $SLUG"
            git push
          else
            echo "Không có preview/$SLUG để dọn"
          fi
