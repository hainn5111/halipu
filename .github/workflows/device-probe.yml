name: Device probe (chỉ đọc)

# Chạy tay (hoặc tự chạy khi push sửa script này): kéo cấu trúc payload loại thiết bị / model (template) / dictionary từ Fonda, in cấu trúc ra log,
# mẫu dữ liệu (tối đa 3 bản ghi mỗi API) lưu trong artifact "device-probe". Không gửi lệnh điều khiển, không ghi dữ liệu.
on:
  workflow_dispatch:
  push:                      # chạy khi sửa chính script/workflow này (tiện cho nhánh chưa có trên main)
    paths: ['e2e/device-probe.js', '.github/workflows/device-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Probe
        env:
          FONDA_USER: ${{ secrets.FONDA_USER }}
          FONDA_PASS: ${{ secrets.FONDA_PASS }}
        run: |
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 8080 --directory web/dist >/dev/null 2>&1 &
          sleep 2
          node e2e/device-probe.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: device-probe, path: probe-out, if-no-files-found: ignore }
