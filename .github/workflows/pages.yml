name: Deploy main to GitHub Pages

# Chỉ `main` deploy ra GỐC trang. Bản build được đẩy vào nhánh gh-pages (GitHub Pages phục vụ nhánh này);
# Trước khi deploy: typecheck + test; lỗi thì dừng, KHÔNG deploy (main luôn là bản đã qua kiểm tra).
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

# Cả 2 workflow cùng ghi vào gh-pages → xếp hàng, không chạy song song.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Typecheck + test + build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          VITE_BUILD_INFO="${GITHUB_REF_NAME}@${GITHUB_SHA::7}" npm run build
      - name: Publish to gh-pages (root)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: web/dist
          clean: true   # xoá luôn thư mục preview/ cũ (quy trình Preview đã bỏ)
          commit-message: "deploy main@${{ github.sha }}"
