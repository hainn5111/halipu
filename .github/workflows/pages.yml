name: Deploy to GitHub Pages

# Phục vụ bản React (web/) ở GỐC trang. Thư mục site/ (bản vanilla cũ) chỉ giữ trong repo để tra cứu, KHÔNG còn được deploy.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Build React app (web/)
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          VITE_BUILD_INFO="${GITHUB_REF_NAME}@${GITHUB_SHA::7}" npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
