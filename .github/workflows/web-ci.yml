name: Web CI (React)

# Build + kiểm thử bản React trong web/ (typecheck, unit test, build; e2e chỉ đọc nếu có secret) khi PR Ready, push vào main (chỉ typecheck+test+build, không e2e), hoặc chạy tay. Không deploy.
# Deploy: chỉ pages.yml (tag v* hoặc chạy tay). Thử nghiệm hằng ngày: preview-commit-local.bat (docs/15).
on:
  workflow_dispatch:
  push:
    branches: [main]        # merge vào main: chỉ kiểm tra, KHÔNG deploy (deploy bằng tag v*)
    paths: ['web/**', 'e2e/web-smoke.js', '.github/workflows/web-ci.yml']
  pull_request:             # chỉ chạy khi mở/cập nhật PR (tiết kiệm minute); thử nghiệm hằng ngày dùng preview-commit-local.bat
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['web/**', 'e2e/web-smoke.js', '.github/workflows/web-ci.yml']

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    # PR ở trạng thái Draft thì bỏ qua (tiết kiệm minute); bấm "Ready for review" để chạy. Chạy tay (workflow_dispatch) luôn chạy.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Typecheck + unit tests + build
        run: |
          npm run typecheck
          npm test
          VITE_BUILD_INFO="${GITHUB_REF_NAME}@${GITHUB_SHA::7}" npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with: { name: web-dist, path: web/dist }
      - name: E2E smoke (read-only, cần secret FONDA_USER/FONDA_PASS)
        if: github.event_name != 'push'
        working-directory: .
        env:
          FONDA_USER: ${{ secrets.FONDA_USER }}
          FONDA_PASS: ${{ secrets.FONDA_PASS }}
        run: |
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 8080 --directory web/dist >/dev/null 2>&1 &
          sleep 2
          node e2e/web-smoke.js
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'push'
        with: { name: web-e2e-screenshots, path: web-*.png, if-no-files-found: ignore }
