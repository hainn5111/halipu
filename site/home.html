<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trang chính · SLCP</title><link rel="stylesheet" href="style.css"></head><body>
<div class="card">
  <p class="sub" id="b" style="font-family:monospace;font-size:12px"></p>
  <div class="ok">✅</div><h1>Đăng nhập thành công</h1>
  <p class="sub">Xin chào, <b id="n"></b></p>
  <pre id="j">Đang tải hồ sơ…</pre>
  <label for="pid">ProjectID để xem LCU (để trống = tự dò như cũ)</label>
  <input id="pid" placeholder="dán projectId" autocomplete="off" spellcheck="false">
  <button type="button" id="go">Xem danh sách LCU</button>
  <a href="scan.html"><button type="button" style="background:#334155;color:#e2e8f0">Quét dự án có LCU đo gần đây</button></a>
  <button id="o">Đăng xuất</button>
</div>
<script src="build-info.js"></script><script src="config.js"></script><script src="api.js"></script>
<script>
if (!SLCP.token) location.replace('index.html');
n.textContent = sessionStorage.getItem('slcp_user');
SLCP.getUser().then(d => { j.textContent = JSON.stringify(d, null, 2); })
  .catch(() => { SLCP.logout(); location.replace('index.html'); });
const bi = window.BUILD_INFO || { branch: 'local', commit: 'dev', time: '' };
b.textContent = `build: ${bi.branch} @ ${bi.commit}${bi.time ? ' · ' + bi.time : ''}`;
pid.value = SLCP.fixedProjectId();
go.onclick = () => {
  const v = pid.value.trim();
  try { v ? localStorage.setItem('pid_fixed', v) : localStorage.removeItem('pid_fixed'); } catch {}
  location.href = 'lcus.html';
};
o.onclick = () => { SLCP.logout(); location.replace('index.html'); };
</script></body></html>
