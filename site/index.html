<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · SLCP</title><link rel="stylesheet" href="style.css"></head><body>
<form class="card" id="f">
  <h1>Đăng nhập</h1><p class="sub">Hệ thống điều khiển chiếu sáng thông minh</p>
  <label for="u">Tài khoản</label><input id="u" autocomplete="username" required>
  <label for="p">Mật khẩu</label><input id="p" type="password" autocomplete="current-password" required>
  <button id="b">Đăng nhập</button><div class="err" id="e"></div>
  <details><summary>Không đăng nhập được trên github.io?</summary>
  API Fonda chạy <b>http</b>, trang này chạy <b>https</b> nên trình duyệt chặn. Trên Chrome: bấm biểu tượng bên trái thanh địa chỉ →
  <i>Site settings</i> → <i>Insecure content</i> → <i>Allow</i>, rồi tải lại trang.</details>
</form>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script><script src="config.js"></script><script src="api.js"></script>
<script>
if (SLCP.token) location.replace('home.html');
f.onsubmit = async ev => {
  ev.preventDefault(); b.disabled = true; e.textContent = '';
  try { await SLCP.login(u.value.trim(), p.value); location.replace('home.html'); }
  catch (x) { e.textContent = x.message; }
  b.disabled = false;
};
</script></body></html>
